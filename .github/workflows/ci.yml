name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, SQLite)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Model quality report
        run: python -m invoice_detector.cli evaluate

  postgres:
    name: test (PostgreSQL 16, row-level security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: owner-pw
          POSTGRES_DB: invoices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the CI-only database above.
      APP_DB_PASSWORD: app-pw
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:owner-pw@localhost:5432/invoices
      TEST_DATABASE_URL: postgresql://invoice_app:app-pw@localhost:5432/invoices
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Test against PostgreSQL
        run: pytest -v -rs
      - name: CLI end to end on PostgreSQL
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:owner-pw@localhost:5432/invoices
          DATABASE_URL: postgresql://invoice_app:app-pw@localhost:5432/invoices
        run: |
          python -m invoice_detector.cli gen-keys > .env
          python -m invoice_detector.cli migrate
          python -m invoice_detector.cli create-org "CI Company"
          python -m invoice_detector.cli seed "CI Company"
          python -m invoice_detector.cli detect "CI Company"

  browser:
    name: browser test (real server, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Run the web app in a real browser
        env:
          RUN_E2E: "1"
          E2E_SCREENSHOTS: e2e-shots
        run: pytest tests/e2e -v -rs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-screenshots
          path: e2e-shots/
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoice-detector .

  production-stack:
    name: production stack (HTTPS, PostgreSQL, secrets, backups)
    runs-on: ubuntu-latest
    env:
      DOMAIN: localhost
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate secret files
        run: PYTHONPATH=src python -m invoice_detector.cli init-deploy deploy/secrets
      - name: Start the stack
        run: |
          $COMPOSE up -d --build
          for i in $(seq 60); do
            [ "$($COMPOSE ps app --format '{{.Health}}')" = healthy ] && break; sleep 3
          done
          $COMPOSE ps
          [ "$($COMPOSE ps app --format '{{.Health}}')" = healthy ]
      - name: HTTPS works and plain HTTP redirects
        run: |
          for i in $(seq 30); do curl -skf https://localhost/health/ready && break; sleep 2; done
          curl -skf https://localhost/health/ready | grep -q '"ready"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          echo "http -> $code"; [ "$code" = 308 ] || [ "$code" = 301 ]
          curl -skI https://localhost/ | grep -i '^strict-transport-security'
      - name: No secret is visible in the app's environment
        run: |
          ! $COMPOSE exec -T app env | grep -E '^(SECRET_KEY|ENCRYPTION_KEYS|INDEX_KEY|DATABASE_URL)='
      - name: Create a company and sign in
        run: |
          $COMPOSE exec -T app python -m invoice_detector.cli create-org "CI Company"
          $COMPOSE exec -T app python -m invoice_detector.cli seed "CI Company"
          printf 'ci-password-123456\nci-password-123456\n' | \
            $COMPOSE exec -T app python -m invoice_detector.cli create-user "CI Company" ci.admin admin
          curl -skf https://localhost/login -H 'content-type: application/json' \
            -d '{"username":"ci.admin","password":"ci-password-123456"}' | grep -q access_token
      - name: Back up, wipe, restore
        run: |
          $COMPOSE exec -T backup bash /backup.sh once
          ls -l backups/
          file=$(ls backups/*.dump | tail -1)
          $COMPOSE exec -T db psql -U postgres -d invoices -c "TRUNCATE invoices CASCADE"
          $COMPOSE exec -T backup bash /backup.sh restore "/backups/$(basename "$file")"
          $COMPOSE exec -T app python -m invoice_detector.cli migrate
          $COMPOSE exec -T app python -m invoice_detector.cli detect "CI Company" | tee detect.txt
          grep -q 'INV-' detect.txt
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # warn only; remove this line to make known CVEs fail the build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit
