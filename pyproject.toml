[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-detector"
version = "0.9.0"
description = "Multi-company invoice anomaly detector: audit rules + Isolation Forest, feedback-tuned risk queue, row-level security"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "defusedxml>=0.7.1",   # makes openpyxl refuse XML "bomb" spreadsheets
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
postgres = ["psycopg[binary]>=3.1"]
# Reading scans and photos of invoices. Also needs the Tesseract program
# (Windows: the UB Mannheim installer; macOS: brew install tesseract; Linux: apt install tesseract-ocr).
ocr = ["pytesseract>=0.3.10", "Pillow>=10.3"]
e2e = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_detector = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
